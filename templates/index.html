<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <% if (baseHref) { %><base href="<%= baseHref %>"><% } %>
        <% if (noindex) { %><meta name="robots" content="noindex"><% } %>
        <title><%= pageTitle %></title>
        <meta name="description" content="<%= description %>">
        <link rel="canonical" href="<%= canonicalUrl %>">
        <meta property="og:type" content="website">
        <meta property="og:site_name" content="<%= siteName %>">
        <meta property="og:title" content="<%= pageTitle %>">
        <meta property="og:description" content="<%= description %>">
        <meta property="og:url" content="<%= canonicalUrl %>">
        <meta name="twitter:card" content="summary">
        <link rel="icon" href="favicon.svg" type="image/svg+xml">
        <link rel="stylesheet" href="style.css?v=<%= version %>">
        <script>document.documentElement.classList.add('js');</script>
    </head>
    <body>
        <div class="layout layout-cleanui">
            <aside class="sidebar sidebar-cleanui">
                <%- sidebar %>
            </aside>

            <main class="content content-cleanui">
                <% if (yearLabel) { %>
                <header>
                    <p class="year-label"><%= yearLabel %></p>
                    <% if (yearTotals) { %><p class="year-totals"><%- yearTotals %></p><% } %>
                </header>
                <% } %>
                <%- content %>
            </main>
        </div>
        <script src="script.js?v=<%= version %>"></script>
    </body>
</html>
